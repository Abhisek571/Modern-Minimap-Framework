; Modern Minimap settings. Delete a line to use its default.

[General]
bEnabled = true
; Size in pixels at 1080p (scaled to your screen height when bScaleWithResolution is true).
iSize = 300
bScaleWithResolution = true
; Corner: TL, TR, BL or BR. Offsets are pixels from that corner (at 1080p).
sCorner = BR
iOffsetX = 40
iOffsetY = 60
; round or square
sShape = round
fOpacity = 0.9
; Brightness of the whole minimap (map and icons), 0.3 to 3.0.
fBrightness = 1.0
; Map style (the map only, not the icons): 0 = natural, 1 = muted, 2 = black and white, 3 = parchment.
iMapStyle = 0
; true: map turns so you always face up. false: north is always up.
bRotateWithPlayer = true
; Turn the map with the camera instead of the character.
bUseCameraYaw = false
; Show/hide key (DirectInput scan code). 74 = numpad minus.
iHideKey = 74
; Video memory for map tiles, in MB.
iCacheMB = 48
; 0 = draw in the HUD pass (recommended), 1 = draw at Present (fallback if the map does not show).
iDrawHook = 0
; Interiors show a map drawn from the navmesh (dark disc with icons if a cell has none). Worldspaces without
; map tiles show a radar (dark disc with icons). true = hide in interiors instead.
bHideInInteriors = false
; Radar zoom: the zoom steps are multiplied by this in interiors.
fRadarZoomScale = 0.5
; Hide during kill moves and the death camera.
bHideInKillCam = true
; Hide while you are in combat.
bHideInCombat = false
; A text line next to the minimap (below it in top corners, above it in bottom corners): game time and/or location.
bClock = false
bLocationName = false
; true = 13:05, false = 1:05 PM.
b24Hour = true
; Colour output: 0 = auto (by the HUD's render target), 1 = never convert, 2 = always convert to linear. Try 1 or 2 if the map looks washed out or too dark.
; Community Shaders HDR setups need 2.
iColorMode = 0
; Brightness of the map when the HUD is drawn in HDR (float target).
fHdrBrightness = 1.0
; Writes a cost line (average microseconds per frame) to ModernMinimap.log once a minute.
bDebugLog = false

[FogOfWar]
; Unexplored land is drawn darker until you have been within about one cell of it. Saved with your game.
bFogOfWar = false
; How dark unexplored land is (0 to 1).
fFogDarkness = 0.5
; Also fog the baked town photos.
bFogInTowns = false

[Interior]
; The interior map shows your floor: from fFloorBelow units below you to fFloorAbove units above you.
fFloorBelow = 120
fFloorAbove = 220
; Other floors: 0 = hidden, up to 1 = fully drawn (faint values such as 0.25 show them dimmed).
fOtherFloorAlpha = 0

[Zoom]
; Zoom steps: world units from the centre to the edge. 4096 units = one cell.
sRadii = 3000,6000,12000
; Zoom key (DirectInput scan code). 78 = numpad plus.
iZoomKey = 78
; Outdoors: zoom out while sprinting or riding, back in when you slow down.
bAutoZoom = true
; How far: at a horse gallop the map shows up to 1 + this times the current zoom step (0.25 to 3.0).
fAutoZoomStrength = 1.0
; Hold this key to zoom out, release to zoom back (DirectInput scan code). 0 = off.
iHoldZoomKey = 0
; How far the hold key zooms out (1.5 to 6.0 times).
fHoldZoomFactor = 3.0

[Shading]
; Light direction (x = east, y = north, z = up). Default: from the north-west.
fLightX = -1.0
fLightY = 1.0
fLightZ = 1.2
fAmbient = 0.35
fDiffuse = 0.9
fShadeMin = 0.2
fShadeMax = 1.6
fBrightness = 1.15
fSaturation = 1.35

[Water]
bEnabled = true
iRed = 60
iGreen = 110
iBlue = 120
fStrength = 0.7

[Icons]
bEnabled = true
; Icon size multiplier.
fScale = 1.0
; Discovered map markers (cities, towns, caves...). Undiscovered ones you have seen are drawn faded.
bMapMarkers = true
bUndiscovered = true
; Tracked quest targets. Off the map they stay on the rim. In another cell they point to the door.
bQuestTargets = true
; Enemies (red), followers (green), other people and animals (blue). Harmless wildlife counts as other.
bHostile = true
bFollowers = true
bNeutral = true
; Dead bodies: 0 = off, 1 = only the ones you killed, 2 = all.
iDead = 1
; Your own map marker.
bCustomMarker = true
; Distance next to each tracked quest target (metres, km from 1000 m).
bQuestDistance = true
; N, E, S, W letters; they turn with the map. 0 = off, 1 = inside the rim, 2 = just outside the rim.
iCompassLetters = 2
; Your last ridden horse (stays on the rim when off the map).
bHorse = true
; Faint dots where you have walked in this worldspace or cell.
bTrail = false
; A '?' for nearby places you have not found yet (no name, no type).
bUndiscoveredNearby = true
; Their radius in world units, only used if the game's own compass distance setting is missing.
fUndiscoveredRadius = 4000
; Merchants, innkeepers, alchemists and spell vendors get a small service icon (also with bNeutral off).
bServices = true
; Cleared dungeons and other cleared places are drawn faded.
bDimCleared = true
; Load doors: 0 = off, 1 = interiors only, 2 = everywhere.
iDoors = 1

[Colors]
; R,G,B,A (0-255).
sCity = 245,230,140,255
sSettlement = 240,230,200,255
sDungeon = 200,180,160,255
sOther = 200,200,200,255
sQuest = 255,200,48,255
sHostile = 230,50,40,255
sFollower = 80,220,80,255
sNeutral = 70,140,240,255
sDead = 160,140,140,255
sDoor = 232,200,128,255
sCustomMarker = 100,200,255,255
sArrow = 255,247,230,255
sHorse = 200,160,110,255
sTrail = 255,240,220,140
sUndiscoveredNearby = 200,200,200,160
; Text: compass letters, the clock and location line, the quest distance label, and the outline drawn behind all
; three. Default: dark text with a light outline. For light text use e.g. 240,240,240,255 with 0,0,0,190.
sCompass = 20,20,20,255
sInfoText = 20,20,20,255
sQuestDistance = 20,20,20,255
sTextOutline = 255,255,255,200
sService = 240,210,140,255
; Guards (only when bNeutral is on) and dragons (always shown).
sGuard = 160,160,180,255
sDragon = 255,140,30,255

[Bake]
; Town photo bake (settings page, "Bake town photos").
; Longest wait in seconds after each camera move before the picture (cells and LOD fade in). With bAdaptiveSettle
; off, every picture waits this long.
fSettleSeconds = 15.0
; Take the picture as soon as the screen has stopped changing: a small look every half second, and two calm changes
; in a row (trees, grass and water moving a little still count as calm) end the wait. Never sooner than
; fSettleMinSeconds, never later than fSettleSeconds. false = always wait fSettleSeconds.
bAdaptiveSettle = true
fSettleMinSeconds = 1.5
; How much the screen may change between two looks and still count as calm: mean brightness change, 0 to 255 scale.
; Raise it if pictures wait the full time for nothing, lower it if LOD is still fading in on the tiles.
fSettleThreshold = 0.75
; Size of the photographed area around each town, fort, farm and so on (0.5 to 4.0). 2.0 takes about 4 times as many photos.
fAreaScale = 1.0
; Skip cells that already have a photo tile (for example from another mod) and only fill gaps.
bKeepExistingTiles = false
; Cells per photo side (1 to 4). 1 = 1x1, sharpest town detail, about 4 times as many photos and as much time.
; 2 = 2x2, the default. 3 = 3x3 and 4 = 4x4 are faster (about 2.3 and 4 times fewer photos) but softer: fewer
; photo pixels per cell. Changing it starts the progress fresh.
iPhotoGrid = 2
; Photograph the whole map: every Tamriel cell with land (from your terrain LOD) inside the map border (the invisible
; wall), not only the area around towns and other map markers. Open sea and land past the border are skipped; the
; walled cities are still photographed on their own. Thousands of photos with the 1x1 grid: a bake of several days,
; which continues where it stopped after a crash or restart.
bFullMap = false
; Side of each finished tile in pixels: 512 (default), 1024 or 2048. 1024 only adds real detail with the 1x1 grid on a
; screen 1080 px tall or more (the log warns when a photo has fewer pixels per cell than this). 1024 takes 4 times
; the disk space of 512. Tiles of different sizes can be mixed in one folder.
iTileSize = 512
; Also write every finished tile as a lossless .bmp to Data\ModernMinimapMasters\tamriel, outside textures so the game
; never loads them. For converting the tiles to BC7 later (the Photo Baker app). The masters are written before the
; colour match; the colour match the tiles got is saved next to them in tone.txt, which the Photo Baker app applies.
; The minimap reads BC1 and BC7 .dds tiles. About 0.75 MB per 512 px tile, 3 MB per 1024 px tile.
bSaveMasters = true
; Fit the colour match from about 30 photos spread over the whole area, taken first, instead of the first 30 photos
; in travel order (a whole-map bake starts in the snowy north). Adds a few minutes of travel at the start.
bSpreadToneFit = true
; Switch the eyes' brightness adaptation off while baking, so a dark or bright spot does not change the exposure of
; the photos around it. Restored when the bake ends. Leave it false: with adaptation off, snow and other bright ground
; comes out blown-out white with no detail left.
bLockExposure = false
; Picture brightness while baking (0.25 to 1.0; 1.0 = as the game shows it). Snow and ice at noon come out pure white
; with no detail at 1.0; 0.7 keeps them below white, and the colour match brightens the photos back. Lower it if the
; log's clipped white share stays high with a lighting or weather mod. Restored when the bake ends.
fPhotoExposure = 0.7
; Photo Baker app runs only: after this many photos, save the progress and quit the game; the app starts it again
; and the bake carries on (a fresh game every few hundred photos crashes far less). 0 = off.
iRestartEvery = 500
; At the end, take every photo that failed (area did not load, camera did not arrive, flat picture) once more.
; Cells still without a photo are named in ModernMinimap.log and in ModernMinimapMissing.txt next to this file.
bRetryFailed = true
; Without SKSE Menu Framework: set to true, also set bHideActorsOnNextStart = true if you like, start the game and
; load a save. The bake starts by itself about 30 seconds later and continues after a crash. Turns itself off when the bake ends.
bStartOnLoad = false
; Set by the settings page: keep NPCs from loading on the next game start, for a crash-free bake.
; Cleared when the bake finishes or is cancelled.
bHideActorsOnNextStart = false
; Set by the Modern Minimap Photo Baker app; leave them false when you play. Both only work with bStartOnLoad = true
; and are cleared together with it when the bake ends.
; Start the bake from the main menu: enters the world with "coc WhiterunOrigin" instead of waiting for a save.
bEnterFromMainMenu = false
; Quit the game once the bake has finished or was cancelled and every photo is written.
bQuitWhenDone = false
